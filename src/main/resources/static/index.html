<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unithon 테스트 페이지</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --accent-dark: #0284c7;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --ok: #4ade80;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: var(--text);
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 24px;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }
  .section {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0f172a;
    color: var(--text);
    font-size: 14px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent-dark);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent); }
  button:active { transform: scale(0.99); }
  .result {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    background: #0f172a;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 20px;
    border: 1px solid #334155;
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--muted);
  }
  .status-dot.ok { background: var(--ok); }
  .status-dot.err { background: var(--err); }
  .greet-output {
    margin-top: 10px;
    font-size: 15px;
    color: var(--accent);
    min-height: 22px;
  }
  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🚀 Unithon 테스트 페이지</h1>
    <p class="subtitle">프론트엔드 · 백엔드 연동 확인용 페이지입니다.</p>

    <div class="section">
      <label>이름을 입력해 보세요</label>
      <input id="nameInput" type="text" placeholder="예: 지향">
      <div class="greet-output" id="greetOutput"></div>
    </div>

    <div class="section">
      <button id="pingBtn">
        <span class="status-dot" id="statusDot"></span>백엔드 연결 테스트 (/api/test)
      </button>
      <div class="result" id="result">버튼을 눌러 API 응답을 확인하세요.</div>
    </div>

    <footer>Spring Boot + Kotlin · static/index.html</footer>
  </div>

<script>
  const nameInput = document.getElementById('nameInput');
  const greetOutput = document.getElementById('greetOutput');
  nameInput.addEventListener('input', () => {
    const v = nameInput.value.trim();
    greetOutput.textContent = v ? `안녕하세요, ${v}님! 👋` : '';
  });

  const pingBtn = document.getElementById('pingBtn');
  const resultBox = document.getElementById('result');
  const statusDot = document.getElementById('statusDot');

  pingBtn.addEventListener('click', async () => {
    statusDot.className = 'status-dot';
    resultBox.textContent = '요청 중...';
    try {
      const res = await fetch('/api/test');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      resultBox.textContent = JSON.stringify(data, null, 2);
      statusDot.className = 'status-dot ok';
    } catch (err) {
      resultBox.textContent = '요청 실패: ' + err.message + '\n(서버가 실행 중인지 확인하세요: ./gradlew bootRun)';
      statusDot.className = 'status-dot err';
    }
  });
</script>
</body>
</html>
